<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Sistema Bancário</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Nubank Pro Max 2</h1>
    </header>

    <main>
        <section class="bloco">
            <h2>Informações do Cliente</h2>
            <div id="clienteInfo">
                <p>Nome: <span id="nomeCliente">Mauro</span></p>
                <p>CPF: <span id="cpfCliente">123.456.789-00</span></p>
                <p>Conta Nº: <span id="numeroConta">1</span></p>
                <p>Saldo Atual: R$ <span id="saldoConta">500</span></p>
            </div>
        </section>

        <section class="bloco">
            <h2>Ações da Conta</h2>

            <div class="acoes">
                <input type="number" id="valorOperacao" placeholder="Valor da operação" />

                <button onclick="depositar()">Depositar</button>
                <button onclick="sacar()">Sacar</button>
                <button onclick="transferir()">Transferir</button>
            </div>
        </section>

        <section class="bloco">
            <h2>Extrato</h2>
            <div id="extrato" class="extrato"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
